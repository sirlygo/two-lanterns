<style>
:root{
  --bg:#0c0a11;--bg2:#12101a;--card:#171320;--card2:#1f1a2a;--line:#2e2839;--line2:#443b55;
  --fg:#ece2cd;--mute:#a79eb3;--dim:#8a8198;
  --ember:#f2a63c;--ember-d:#bf7a14;--ember-a:rgba(242,166,60,.14);--ember-on:#1a1006;
  --verd:#45d4bf;--verd-d:#1c9b89;--verd-a:rgba(69,212,191,.13);--verd-on:#04211d;
  --gold:#e9c46a;--bad:#ef7468;--good:#93dd9f;--amber:#e3ad4f;
  --who:var(--ember);--who-d:var(--ember-d);--who-a:var(--ember-a);--on:var(--ember-on);
  --r:14px;
  --disp:'Cinzel','Trajan Pro',Georgia,'Times New Roman',serif;
  --text:'Spectral',Georgia,'Times New Roman',serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:17px;line-height:1.6;-webkit-text-size-adjust:100%}
#app{min-height:100vh;background:radial-gradient(1200px 520px at 50% -120px,rgba(242,166,60,.07),transparent 70%),radial-gradient(900px 500px at 100% 0,rgba(69,212,191,.05),transparent 70%)}
.p0{--who:var(--ember);--who-d:var(--ember-d);--who-a:var(--ember-a);--on:var(--ember-on)}
.p1{--who:var(--verd);--who-d:var(--verd-d);--who-a:var(--verd-a);--on:var(--verd-on)}
[tabindex="-1"]:focus{outline:none}
:focus-visible{outline:2px solid var(--who);outline-offset:3px;border-radius:6px}
button{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--disp);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.pn{font-weight:600}.pn0{color:var(--ember)}.pn1{color:var(--verd)}
.center{text-align:center}.fine{font-size:.82rem;color:var(--dim)}

/* shell */
.wrap{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:6px 28px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0}
.brand{display:inline-flex;align-items:center;gap:10px;font:600 .8rem/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--fg)}
.lp{display:inline-flex;gap:2px}.lp svg{width:20px;height:20px}.l0{color:var(--ember)}.l1{color:var(--verd)}
.where{font:600 .72rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute);display:inline-flex;align-items:center;gap:8px}
.foot{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:space-between;align-items:center;margin-top:34px;padding-top:14px;border-top:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:6px 2px;color:var(--mute);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.linkbtn:hover{color:var(--fg)}.linkbtn.warn{color:var(--bad)}
.confirm{font-size:.88rem;color:var(--mute)}
.screen{display:block}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* art plates */
.plate{position:relative;width:100%;aspect-ratio:8/5;max-height:min(54vh,470px);border-radius:var(--r);overflow:hidden;background:#07060b;box-shadow:0 0 0 1px var(--line),0 22px 50px -26px #000}
.plate.short{aspect-ratio:16/7;max-height:min(34vh,290px)}
.plate.tall{max-height:min(62vh,540px)}
.plate.hero{max-height:min(58vh,520px)}
.plate svg{display:block;width:100%;height:100%}
.fl{transform-box:fill-box;transform-origin:center;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{opacity:.84;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
.mote{animation:mote 9s linear infinite}
@keyframes mote{0%{transform:translateY(0);opacity:.15}50%{opacity:.85}100%{transform:translateY(-24px);opacity:.1}}

/* type */
.screen>h1,.screen>h2{margin-top:1.3rem}
h1{font-size:clamp(2.3rem,9vw,4rem);letter-spacing:.06em;text-align:center;text-transform:uppercase}
h1 span{color:var(--ember)}
h1 em{font-style:normal;color:var(--verd);background:linear-gradient(90deg,var(--ember),var(--verd));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:clamp(1.45rem,5vw,2.1rem);letter-spacing:.03em}
h2.q{max-width:26ch}
.tag{font-size:1.25rem;text-align:center;margin:.7rem auto 0;max-width:40ch;color:var(--fg)}
.sub{text-align:center;color:var(--mute);max-width:56ch;margin:.7rem auto 0}
.lead{color:var(--mute);margin-top:.55rem;max-width:62ch}
.story{margin-top:.8rem;max-width:64ch;font-size:1.08rem}
.story em,.res .story em{color:var(--gold);font-style:italic}
.eyebrow{margin-top:1.25rem;font:600 .74rem/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;color:var(--gold)}
.eyebrow+h2,.eyebrow+h1{margin-top:.5rem}
.soft{color:var(--mute);font-style:italic}

/* buttons */
.bar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:14px 0 calc(14px + env(safe-area-inset-bottom,0px));margin-top:14px;background:linear-gradient(to top,var(--bg) 62%,rgba(12,10,17,0))}
.bar.static{position:static;background:none;padding-bottom:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;min-height:50px;padding:.95rem 1.7rem;border-radius:999px;border:1px solid var(--who-d);background:linear-gradient(180deg,var(--who),var(--who-d));color:var(--on);font:700 .9rem/1.1 var(--disp);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;text-align:center;max-width:100%;transition:transform .12s ease,box-shadow .2s ease,opacity .2s}
.btn.primary{box-shadow:0 10px 32px -12px var(--who)}
.btn:hover:not([disabled]){transform:translateY(-1px)}
.btn:active:not([disabled]){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line2);box-shadow:none}
.btn.ghost:hover:not([disabled]){border-color:var(--who);color:var(--fg)}
.btn.small{min-height:42px;padding:.6rem 1.1rem;font-size:.74rem}
.btn[disabled]{opacity:.42;cursor:not-allowed;box-shadow:none;filter:saturate(.6)}
.btn svg{width:1.25em;height:1.25em}

/* title */
.how{list-style:none;padding:0;margin:1.6rem auto 0;display:grid;gap:12px;max-width:640px}
.how li{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.how svg{flex:none;width:34px;height:34px;color:var(--gold)}
.how b{font-family:var(--disp);letter-spacing:.03em;font-weight:600}
.title .bar{margin-top:18px}

/* names */
.names form{margin-top:1.3rem;display:grid;gap:14px;max-width:520px}
.field{display:grid;gap:7px}
.field span{display:flex;align-items:center;gap:8px;font:600 .75rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--who)}
.field svg{width:20px;height:20px}
.field input{width:100%;font:600 1.15rem/1.2 var(--text);padding:.9rem 1rem;color:var(--fg);background:var(--card);border:1.5px solid var(--line2);border-radius:12px}
.field input:focus{outline:none;border-color:var(--who);box-shadow:0 0 0 3px var(--who-a)}
.names .bar{justify-content:flex-start}

/* who header (create / choose) */
.who{display:flex;align-items:center;gap:14px;margin:4px 0 12px}
.pv{flex:none;width:56px;height:73px}.pv svg,.mport svg,.cport svg{display:block;width:100%;height:100%}
.wt{display:grid;gap:3px}.wt small{font:600 .72rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.wt b{font:700 1.3rem/1.1 var(--disp)}
.dots,.prog{display:inline-flex;gap:5px;align-items:center}
.dots i,.prog i{width:9px;height:9px;border-radius:50%;background:#2c2536;display:inline-block}
.dots i.done,.prog i.done{background:var(--dim)}
.dots i.now,.prog i.now{background:var(--gold);box-shadow:0 0 9px var(--gold)}
.subnav{display:flex;justify-content:center;min-height:30px;margin-top:8px}

/* options */
.opts{display:grid;gap:12px;grid-template-columns:minmax(0,1fr);margin-top:1.1rem}
.opt{position:relative;display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:16px 40px 16px 16px;border-radius:var(--r);background:var(--card);border:1.5px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s,box-shadow .2s,transform .12s}
.opt:hover{border-color:var(--line2);background:var(--card2)}
.opt:active{transform:scale(.995)}
.opt.sel{border-color:var(--who);background:linear-gradient(180deg,var(--who-a),var(--card));box-shadow:0 0 0 1px var(--who),0 14px 34px -18px var(--who)}
.oic{flex:none;width:50px;height:50px;color:var(--gold);padding:4px;border-radius:12px;background:rgba(255,255,255,.03)}
.oic svg{width:100%;height:100%}
.opt.sel .oic{color:var(--who)}
.obody{display:grid;gap:6px;min-width:0}
.ot{font:700 1.02rem/1.25 var(--disp);letter-spacing:.02em}
.od{color:var(--mute);font-size:.96rem;line-height:1.5}
.om{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
.tick{position:absolute;top:12px;right:12px;width:24px;height:24px;color:var(--who);opacity:0;transform:scale(.6);transition:opacity .15s,transform .15s}
.tick svg{width:100%;height:100%}
.opt.sel .tick{opacity:1;transform:none}
.why{display:block;font-size:.84rem;color:var(--mute);font-style:italic}
.plus{display:inline-block;margin-right:.45em;font:700 .8rem/1 var(--disp);color:var(--good);font-style:normal}
.edge{margin-top:1rem;padding:12px 14px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.015)}
.edge b{font:600 .72rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.edge ul{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:4px;font-size:.92rem;color:var(--mute)}
.mirror{margin-top:.9rem;padding-left:14px;border-left:3px solid var(--who);color:var(--fg);font-size:1.05rem}

/* chips */
.chip{display:inline-flex;align-items:center;gap:.4em;font:600 .68rem/1 var(--disp);letter-spacing:.07em;text-transform:uppercase;padding:.5em .75em;border-radius:999px;border:1px solid var(--line2);color:var(--mute);background:rgba(255,255,255,.025);white-space:nowrap;max-width:100%}
.chip svg{width:1.35em;height:1.35em}
.chip.stat{color:var(--fg);border-color:#5a4d70}
.chip.att.a-team{color:var(--good);border-color:rgba(147,221,159,.45)}
.chip.att.a-self{color:var(--amber);border-color:rgba(227,173,79,.45)}
.chip.att.a-solo{color:var(--mute)}
.chip.odds{color:var(--gold);border-color:rgba(233,196,106,.4)}
.chip.pos{color:var(--good);border-color:rgba(147,221,159,.45)}
.chip.neg{color:var(--bad);border-color:rgba(239,116,104,.5)}
.chip.gold{color:var(--gold);border-color:rgba(233,196,106,.5)}
.chip.relic{color:#c7b6ff;border-color:rgba(199,182,255,.5);white-space:normal}
.chip.note{white-space:normal;line-height:1.3}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chips.center{justify-content:center}

/* handoff */
.handoff h2{text-align:center}.handoff .lead{text-align:center;margin-inline:auto}
.handoff .plate{box-shadow:0 0 0 1px var(--who-d),0 0 80px -20px var(--who)}

/* meet */
.chars{display:grid;gap:16px;margin-top:1.2rem}
.char{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);padding:18px;display:grid;gap:10px}
.cport{width:96px;height:125px;margin:0 auto}
.char h3{text-align:center;font-size:1.4rem}.epi{text-align:center;color:var(--gold);font:600 .78rem/1 var(--disp);letter-spacing:.18em;text-transform:uppercase}
.stats{margin:0;display:grid;gap:6px}.srow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.srow dt{font:600 .74rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}.srow dd{margin:0;display:inline-flex;align-items:center;gap:10px}
.srow dd b{font:700 1rem/1 var(--disp);min-width:1ch;text-align:right}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{display:inline-block;width:11px;height:11px;border-radius:3px;background:#2b2535}
.stats .pips i.on{background:var(--gold)}.hpbar .pips i.on{background:#e8695c}.danger .pips i.on{background:var(--bad)}
.vit{display:flex;flex-wrap:wrap;gap:6px 14px;justify-content:center;align-items:center;font-size:.9rem;color:var(--mute)}
.st{display:inline-flex;align-items:center;gap:5px;font:600 .82rem/1 var(--disp);color:var(--fg)}
.st svg{width:18px;height:18px;color:var(--gold)}.st.bad svg,.st.bad{color:var(--bad)}.st.spent{opacity:.35}.st.ready svg{color:var(--who)}
.traits{list-style:none;margin:2px 0 0;padding:10px 0 0;border-top:1px solid var(--line);display:grid;gap:7px;font-size:.92rem}
.traits li{display:grid;grid-template-columns:70px 22px 1fr;gap:8px;align-items:center}
.traits .k{font:600 .64rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}.traits svg{width:22px;height:22px;color:var(--gold)}
.rules{margin-top:1.2rem;border:1px solid var(--line);border-radius:var(--r);background:var(--card);padding:4px 16px}
.rules summary{cursor:pointer;padding:12px 0;font:600 .78rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.rules ul{margin:0 0 12px;padding-left:1.1em;display:grid;gap:8px;color:var(--mute);font-size:.95rem}

/* intro */
.meta{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin-top:1rem}
.danger{display:inline-flex;align-items:center;gap:10px}.danger small{font:600 .68rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.tollpill{display:inline-flex;align-items:center;gap:8px;padding:.5em .9em;border-radius:999px;border:1px solid var(--line2);font:600 .68rem/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.tollpill svg{width:18px;height:18px}.tollpill.w1{color:var(--amber);border-color:rgba(227,173,79,.45)}.tollpill.w2{color:var(--bad);border-color:rgba(239,116,104,.55)}
.mood{margin-top:.7rem;color:var(--mute)}.mood.w2 em{color:var(--bad)}.mood em{color:var(--gold)}
.minis{display:grid;gap:10px;margin-top:1.1rem}
.mini{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-left:3px solid var(--who);border-radius:12px;background:var(--card)}
.mport{width:40px;height:52px}
.mmain{display:grid;gap:3px;min-width:0}.mmain small{color:var(--mute);font:600 .64rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase}
.hpbar{display:inline-flex;align-items:center;gap:8px}.hpbar small{color:var(--mute);font:600 .72rem/1 var(--disp);letter-spacing:.04em;text-transform:none}
.mstats{display:flex;flex-wrap:wrap;gap:8px 12px;justify-content:flex-end;align-items:center}
.minis.tight{margin-top:1.2rem}

/* reveal */
.picks{display:grid;gap:12px;grid-template-columns:1fr 1fr;margin-top:1.1rem}
.pick{display:grid;gap:6px;justify-items:center;text-align:center;padding:14px 10px;border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);background:var(--card)}
.pick .pic{width:42px;height:42px;color:var(--gold)}.pick .pic svg{width:100%;height:100%}
.pick b{font:700 .95rem/1.25 var(--disp)}.pick small{font:600 .68rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.die{display:inline-block;width:58px;height:58px;flex:none}.die svg{display:block;width:100%;height:100%;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
.rolling .die{animation:tumble .56s linear infinite}
@keyframes tumble{0%{transform:translateY(0) rotate(0)}22%{transform:translateY(-14px) rotate(95deg)}50%{transform:translateY(0) rotate(190deg) scale(.96,1.05)}72%{transform:translateY(-7px) rotate(275deg)}100%{transform:translateY(0) rotate(360deg)}}
.die.pop{animation:pop .5s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-90deg);opacity:.2}100%{transform:none;opacity:1}}

/* results */
.results>h2{text-align:center}
.resgrid{display:grid;gap:16px;margin-top:1.1rem}
.res{overflow:hidden;border-radius:var(--r);background:var(--card);border:1.5px solid var(--who-d);box-shadow:0 22px 40px -28px #000}
.rplate{position:relative;aspect-ratio:16/7;max-height:230px;overflow:hidden;background:#07060b}
.rplate svg{display:block;width:100%;height:100%}
.badge{position:absolute;left:12px;bottom:12px;display:inline-flex;align-items:center;gap:.55em;padding:.6em 1em;border-radius:999px;font:700 .8rem/1 var(--disp);letter-spacing:.14em;text-transform:uppercase;background:rgba(10,8,14,.82);border:1.5px solid;backdrop-filter:blur(4px)}
.badge svg{width:1.5em;height:1.5em}
.badge.t0{color:var(--bad);border-color:var(--bad)}.badge.t1{color:var(--amber);border-color:var(--amber)}.badge.t2{color:var(--good);border-color:var(--good)}.badge.t3{color:#ffe08a;border-color:#ffd25a;box-shadow:0 0 22px -4px #ffd25a}
.rbody{padding:16px 18px 18px;display:grid;gap:12px}
.rhead{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:1.05rem}
.move{font:600 .78rem/1.3 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.math{display:flex;align-items:center;gap:14px}
.eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:.15em .45em;font:700 1.15rem/1.5 var(--disp)}
.eq small{font:600 .66rem/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin-left:-.1em}
.eq i{font-style:normal;color:var(--dim)}.eq .tot{font-size:1.5rem;color:var(--who)}.eq .vs{margin-left:.2em}
.res .story{margin:0;font-size:1.02rem;max-width:none}
.pairline{text-align:center;margin:1.2rem auto 0;max-width:56ch;color:var(--mute);font-style:italic}

/* ending */
.etitle{margin-top:1rem}
.chapter{max-width:68ch;margin:2.4rem auto 0;display:grid;gap:.8rem}
.chapter h3{font:700 .8rem/1 var(--disp);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:14px}
.chapter h3::after{content:"";flex:1;height:1px;background:var(--line2)}
.chapter p{font-size:1.06rem}
.fates{display:grid;gap:16px;max-width:none}
.fate{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);padding:18px;display:grid;gap:8px}
.fate .cport{width:84px;height:109px}
.fate h3{display:block;font:700 1.1rem/1.2 var(--disp);letter-spacing:.02em;text-transform:none;color:var(--fg);text-align:center}.fate h3::after{display:none}
.fate h3 small{display:block;margin-top:4px;font:600 .66rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.flab{display:flex;align-items:center;justify-content:center;gap:8px;font:700 .72rem/1 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--who)}
.flab svg{width:20px;height:20px}
.fate .motive{color:var(--mute);font-size:.98rem;padding-top:8px;border-top:1px solid var(--line)}
.carried{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.recap li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.rn{font:600 .78rem/1.2 var(--disp);letter-spacing:.06em;color:var(--fg)}
.rc{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;border:1px solid var(--who-d);color:var(--who);min-width:50px;justify-content:center}
.rc svg{width:18px;height:18px}.rc small{font:700 .66rem/1 var(--disp)}
.rc.t0{background:rgba(239,116,104,.14)}.rc.t3{background:var(--who-a);box-shadow:0 0 12px -4px var(--who)}.rc.t1{opacity:.75}
.legendkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--dim)}.legendkey span{display:inline-flex;align-items:center;gap:6px}.legendkey svg{width:16px;height:16px}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:2.4rem 0 .6rem}
.copybox{display:block;width:100%;max-width:68ch;margin:12px auto 0;background:var(--card);color:var(--fg);border:1px solid var(--line2);border-radius:12px;padding:12px;font:inherit;font-size:.92rem;resize:vertical}

@media (min-width:700px){
  .opts{grid-template-columns:1fr 1fr}
  .chars,.fates{grid-template-columns:1fr 1fr}
  .resgrid{grid-template-columns:1fr 1fr}
  .pick{padding:16px}
}
@media (max-width:420px){
  body{font-size:16px}
  .btn{padding-inline:1.2rem;letter-spacing:.07em}
  .opt{padding:14px 36px 14px 12px;gap:11px}
  .oic{width:42px;height:42px}
  .mini{grid-template-columns:auto 1fr;}
  .mstats{grid-column:1/-1;justify-content:flex-start}
  .traits li{grid-template-columns:60px 22px 1fr}
  .math{gap:10px}.die{width:50px;height:50px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- saved lanterns + live sheet ---------- */
.rnote{margin-top:.7rem;max-width:520px}
.sheet{margin:2px 0 14px;padding:12px 14px 11px;border:1px solid var(--line);border-top:3px solid var(--who);border-radius:var(--r);background:linear-gradient(180deg,var(--who-a),var(--card) 70%);display:grid;gap:9px}
.sstats{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px 10px}
.sb{display:grid;gap:5px;min-width:0}
.sb dt{font:600 .62rem/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.sb dd{margin:0;display:grid;gap:6px}
.sv{display:flex;align-items:baseline;gap:5px;min-height:1.35rem}
.sv b{font:700 1.3rem/1 var(--disp);color:var(--fg)}
.dl{font:700 .72rem/1 var(--disp);font-style:normal;color:var(--good)}.dl.neg{color:var(--bad)}
.sheet .pips,.rstats .pips{gap:2px}
.sheet .pips i,.rstats .pips i{width:100%;max-width:11px;min-width:6px;aspect-ratio:1;height:auto;border-radius:2px;flex:1 1 0}
.sheet .pips i.on,.rstats .pips i.on{background:var(--gold)}
.sheet .pips i.new{background:var(--who);box-shadow:0 0 9px -1px var(--who)}
.sheet .pips i.lost{background:transparent;box-shadow:inset 0 0 0 1.5px var(--bad)}
.svit{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;padding-top:8px;border-top:1px solid var(--line)}
.svit .st{font-size:.76rem;letter-spacing:.02em}.svit .dl{margin-left:2px}

.roster .lead{max-width:56ch}
.rgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:1.2rem}
.rcard{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;transition:border-color .15s,box-shadow .2s,background .15s}
.rcard:hover{border-color:var(--line2)}
.rcard.sel{border-color:var(--who);background:linear-gradient(180deg,var(--who-a),var(--card) 62%);box-shadow:0 0 0 1px var(--who),0 16px 36px -20px var(--who)}
.rpick{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"port main" "stats stats" "vit vit";gap:10px 14px;align-items:center;width:100%;padding:14px 14px 12px;text-align:left;background:none;border:0;cursor:pointer;flex:1}
.rport{grid-area:port;width:56px;height:73px;display:block}.rport svg{display:block;width:100%;height:100%}
.rmain{grid-area:main;display:grid;gap:5px;min-width:0;padding-right:30px}
.rname{font:700 1.18rem/1.15 var(--disp);color:var(--who);overflow-wrap:anywhere}
.rmain small{font:600 .64rem/1.35 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.ricons{display:flex;flex-wrap:wrap;gap:4px}
.ri{display:inline-flex;width:26px;height:26px;padding:2px;border-radius:7px;background:rgba(255,255,255,.035);color:var(--gold)}.ri svg{width:100%;height:100%}
.rcard.sel .ri{color:var(--who)}
.rstats{grid-area:stats;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px 10px;padding-top:10px;border-top:1px solid var(--line)}
.rs{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:5px 4px;min-width:0}
.rk{font:600 .6rem/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rs b{grid-column:2;grid-row:1;font:700 1.05rem/1 var(--disp);color:var(--fg)}
.rs .pips{grid-column:1/-1;grid-row:2;display:flex}
.rvit{grid-area:vit;display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center}
.rvit .st{font-size:.76rem;letter-spacing:.02em}
.rpick .tick{top:14px;right:12px}
.rcard.sel .tick{opacity:1;transform:none}
.rfoot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 12px;padding:6px 14px 8px;border-top:1px solid var(--line);font-size:.8rem;color:var(--dim);min-height:38px}
.rfoot .last{font-style:italic;color:var(--mute)}
.rfoot>span{display:inline-flex;flex-wrap:wrap;gap:2px 10px}
.rfoot .linkbtn{font-size:.8rem;padding:6px 2px}
.rconf{font-size:.8rem;color:var(--mute)}
.tag-w{display:inline-flex;align-items:center;padding:.35em .7em;border:1px dashed var(--line2);border-radius:999px;font:600 .6rem/1 var(--disp);letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rnew{margin-top:14px}
.roster .bar{margin-top:18px}
.roster .subnav{margin-top:10px}

@media (min-width:700px){
  .rgrid{grid-template-columns:1fr 1fr}
  .sstats{gap:6px 18px}
}
@media (max-width:420px){
  .sheet{padding:10px 12px 9px}
  .sv b{font-size:1.15rem}
  .sb dt{font-size:.58rem;letter-spacing:.08em}
  .rpick{padding:12px 12px 10px;gap:9px 12px}
  .rmain{padding-right:26px}
  .rk{font-size:.56rem;letter-spacing:.06em}
}

.savednote{max-width:56ch;margin:2rem auto 0}
.savednote+.actions{margin-top:.9rem}

/* ---------- the chandler's stall ---------- */
.stall .meta{margin-top:.9rem}
.stall .skip{margin-left:auto}
.hint{margin-top:.7rem;max-width:62ch}
.aisle{display:flex;align-items:center;gap:14px;margin:1.7rem 0 0;font:700 .76rem/1 var(--disp);letter-spacing:.22em;text-transform:uppercase;color:var(--gold)}
.aisle::after{content:"";flex:1;height:1px;background:var(--line2)}
.shoppers{display:grid;gap:10px;margin-top:.9rem}
.shopper{position:relative;width:100%;text-align:left;cursor:pointer;font:inherit;color:inherit;padding-right:46px;transition:border-color .15s,background .15s,box-shadow .2s}
.shopper:hover{border-top-color:var(--line2);border-right-color:var(--line2);border-bottom-color:var(--line2)}
.shopper.sel{border-color:var(--who);background:linear-gradient(180deg,var(--who-a),var(--card));box-shadow:0 0 0 1px var(--who),0 14px 34px -20px var(--who)}
.shopper .tick{top:50%;margin-top:-12px}
.shopper.sel .tick{opacity:1;transform:none}
.said{margin-top:1rem;padding:11px 14px;border-left:3px solid var(--who);border-radius:0 12px 12px 0;background:var(--who-a);color:var(--fg);font-style:italic}
.said:focus{outline:none}
.wares{display:grid;gap:12px;margin-top:.9rem}
.ware{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 14px;align-items:start;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--card)}
.ware.off .oic,.ware.off .obody{opacity:.55}
.ware .buy{grid-column:1/-1;width:100%}
.ware .btn[disabled]{opacity:.78;filter:none}
.btn.cover{background:transparent;color:var(--who);border-color:var(--who);box-shadow:none}
.from{font-size:.84rem;color:var(--dim);font-style:italic}
.chip.eff{white-space:normal;line-height:1.3}
.ledger{margin-top:1.5rem;padding:12px 14px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.015)}
.ledger>b{font:600 .72rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.ledger ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:8px;font-size:.94rem;color:var(--mute)}
.ledger li{display:flex;gap:10px;align-items:center}.ledger svg{flex:none;width:22px;height:22px;color:var(--gold)}
.broke{margin-top:1.2rem}
.nothing{margin-top:.9rem}
.wares.compact{gap:8px}
.ware.row{display:block;padding:0;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.015)}
.ware.row>summary,.ware.row.sold{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:58px;padding:9px 14px 9px 10px}
.ware.row>summary{position:relative;cursor:pointer;list-style:none;padding-right:38px}

.ware.row .rowt{display:grid;gap:3px;min-width:0}
.ware.row .ot{font-size:.95rem;color:var(--mute)}
.ware.row .why{font:600 .72rem/1.2 var(--disp);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}

/* the Book of Endings */
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.bk-big{margin-top:1.1rem;text-align:center;font:600 .86rem/1.2 var(--disp);letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.bk-big b{display:block;font-size:clamp(2.8rem,12vw,4.2rem);line-height:1;letter-spacing:.02em;color:var(--gold);margin-bottom:.25rem}
.bk-rule{text-align:center;color:var(--mute);max-width:58ch;margin:.8rem auto 0;font-size:.98rem}
.bk-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:560px;margin:1.4rem auto 0}
.bk-meter{display:grid;gap:5px;padding:12px 8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--card);text-align:center}

.bk-bar{display:block;height:4px;border-radius:2px;background:var(--line);overflow:hidden;margin-top:3px}
.bk-bar b{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ember),var(--verd))}
.bk-full{text-align:center;color:var(--gold);max-width:48ch;margin:1.1rem auto 0;font-style:italic}
.bk-rows,.bk-tags,.bk-list{list-style:none;margin:0;padding:0}
.bk-rows{display:grid;gap:8px}
.bk-row{display:block;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.bk-row>summary,.bk-row.off{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:54px;padding:10px 14px}
.bk-row>summary{position:relative;cursor:pointer;list-style:none;padding-right:38px}
.bk-row>summary::-webkit-details-marker{display:none}
.bk-row>summary::after{content:"";position:absolute;right:15px;top:50%;width:7px;height:7px;margin-top:-6px;border-right:2px solid var(--dim);border-bottom:2px solid var(--dim);transform:rotate(45deg);transition:transform .15s}
.bk-row[open]>summary::after{transform:rotate(-135deg);margin-top:-2px}
.bk-t{font:600 .92rem/1.25 var(--disp);letter-spacing:.05em;color:var(--fg);min-width:0}
.bk-c{flex:none;font-size:.84rem;color:var(--dim);white-space:nowrap}
.bk-row.off{background:transparent;border-style:dashed;border-color:var(--line)}
.bk-row.off .bk-t{color:var(--dim);letter-spacing:.3em}
.bk-list{display:grid;padding:0 14px 8px}
.bk-list li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line);align-items:baseline}
.bk-b{font-size:1rem;color:var(--fg);min-width:0}
.bk-f{grid-column:1;font:600 .68rem/1.35 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.bk-x{grid-column:2;grid-row:1/3;align-self:center;font:600 .84rem/1 var(--disp);color:var(--dim)}
.bk-new{font:600 .62rem/1 var(--disp);font-style:normal;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(233,196,106,.5);border-radius:999px;padding:.3em .65em;margin-left:.4em;white-space:nowrap}
.bk-list li.new .bk-b{color:var(--gold)}
.bk-tags{display:flex;flex-wrap:wrap;gap:8px}
.bk-tag{display:inline-flex;align-items:center;gap:.5em;padding:.5em .9em;border-radius:999px;border:1px solid var(--line2);background:var(--card);font-size:.94rem;line-height:1.25;color:var(--fg)}
.bk-tag svg{flex:none;width:1.25em;height:1.25em;color:var(--gold)}
.bk-tag.off{border-style:dashed;border-color:var(--line);background:transparent;color:var(--dim);font:600 .78rem/1.25 var(--disp);letter-spacing:.3em;padding-inline:1.1em}
.bk-note{display:flex;gap:12px;align-items:flex-start;max-width:56ch;margin:1.1rem auto 0;padding:12px 14px;border:1px dashed var(--line2);border-radius:var(--r);background:rgba(255,255,255,.015);font-size:.96rem}
.bk-note.new{border-style:solid;border-color:rgba(233,196,106,.5);background:rgba(233,196,106,.06)}
.bk-note>svg{flex:none;width:30px;height:30px;margin-top:2px;color:var(--gold)}
.bk-note>div{min-width:0}

.bk-note .linkbtn{padding:8px 0 0}
@media (max-width:420px){
  .bk-row>summary,.bk-row.off{padding-left:12px}
  .bk-t{font-size:.86rem}
}

/* the story layer: what the descent remembers, the Sexton's chalk, the day-book, banter, threads */
.behind,.hook,.sexton,.gossip{margin-top:1rem;max-width:64ch}
.behind{padding-left:14px;border-left:2px solid var(--line2);color:var(--mute);font-style:italic}
.behind .lbl,.chalk .lbl{display:block;margin-bottom:.35rem;font:600 .64rem/1 var(--disp);font-style:normal;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.hook{color:var(--mute)}
.hook+.hook{margin-top:.5rem}
.chalk{margin-top:1rem;max-width:64ch;padding:11px 14px;border:1px dashed rgba(236,226,205,.3);border-radius:10px;background:rgba(236,226,205,.04);color:#d8cfbb;font-style:italic;font-size:1.02rem}
.sexton{padding-left:14px;border-left:3px solid var(--gold);color:var(--fg);font-size:1.06rem}
.gossip{color:var(--mute);font-style:italic}
.pagepill{display:inline-flex;align-items:center;gap:8px;padding:.5em .9em;border-radius:999px;border:1px solid rgba(233,196,106,.45);font:600 .68rem/1 var(--disp);letter-spacing:.1em;text-transform:uppercase;color:var(--gold)}
.pagepill svg{width:18px;height:18px}
.whisper{display:flex;gap:10px;align-items:flex-start;max-width:64ch;margin-top:.9rem;padding:10px 14px;border-radius:var(--r);border:1px solid var(--line2);border-left:3px solid var(--who);background:var(--who-a);color:var(--fg);font-style:italic}
.whisper>svg{flex:none;width:20px;height:20px;margin-top:3px;color:var(--who)}
.whisper>span{min-width:0}
.pagecard{max-width:58ch;margin:1.3rem auto 0;padding:14px 16px 13px;border:1px solid rgba(233,196,106,.45);border-radius:var(--r);background:linear-gradient(180deg,rgba(233,196,106,.08),rgba(233,196,106,.025))}
.pagecard .ph{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;font:700 .68rem/1.3 var(--disp);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.pagecard .ph svg{width:1.3em;height:1.3em;vertical-align:-.25em;margin-right:.5em}
.pagecard .ph .nb{white-space:nowrap}
.pagecard .pt{margin-top:.65rem;font-size:1.1rem;font-style:italic;color:var(--fg)}
.pagecard .pm{margin-top:.55rem;font-size:.9rem;color:var(--mute)}
.pagecard .pl{margin-top:.35rem;font-size:.9rem;color:var(--dim);font-style:italic}
.banter{display:grid;gap:.5rem;max-width:54ch;margin:1.3rem auto 0}
.banter .bl{display:grid;gap:.15rem;max-width:88%}
.banter .bl.p1{justify-self:end;text-align:right}
.banter .sp{font:600 .66rem/1 var(--disp);letter-spacing:.16em;text-transform:uppercase}
.banter .say{font-style:italic;color:var(--fg)}
.thread{margin-top:.2rem;color:var(--mute);font-size:1rem}
.thread+.thread{margin-top:.4rem}
.fate .chips{margin-top:.55rem}
.cause .cname{font:700 1.1rem/1.3 var(--disp);color:var(--gold)}
.cause .truth{font-size:1.06rem}
.dbpages{list-style:none;margin:.2rem 0 0;padding:0;display:grid;gap:.5rem}
.dbpages li{padding:8px 12px;border-left:2px solid var(--gold);color:var(--mute);font-style:italic;font-size:.98rem}
.dbpages li.miss{border-left-style:dashed;border-left-color:var(--line2);color:var(--dim)}
.rumor{color:var(--mute);font-style:italic}
.bk-note .sx{margin-top:.45rem;font-style:italic;color:var(--mute)}
.bk-causes{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.bk-cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.bk-cause .bk-truth{grid-column:1/-1;font-size:.94rem;color:var(--mute);font-style:italic}
@media (max-width:420px){.banter .bl{max-width:96%}.pagecard{padding:13px 13px 12px}}

/* ---------- motion: candle-slow easing, transform and opacity only. Everything here is off under prefers-reduced-motion (the rule near the top of the file) ---------- */
#app{overflow-x:clip}
@keyframes pipon{from{transform:scale(0);opacity:0}to{transform:none;opacity:1}}

/* a screen arrives part by part; re-renders in place (#app.still) do not replay it */
#app:not(.still) .screen>*{animation:rise .55s cubic-bezier(.22,.7,.25,1) both}
#app:not(.still) .screen>.plate{animation:fadein .9s ease both}
#app:not(.still) .screen>.bar{animation:fadein .5s ease .35s both}
#app:not(.still) .screen>:nth-child(2){animation-delay:0.05s}
#app:not(.still) .screen>:nth-child(3){animation-delay:0.10s}
#app:not(.still) .screen>:nth-child(4){animation-delay:0.15s}
#app:not(.still) .screen>:nth-child(5){animation-delay:0.20s}
#app:not(.still) .screen>:nth-child(6){animation-delay:0.25s}
#app:not(.still) .screen>:nth-child(7){animation-delay:0.30s}
#app:not(.still) .screen>:nth-child(8){animation-delay:0.35s}
#app:not(.still) .screen>:nth-child(9){animation-delay:0.40s}
#app:not(.still) .screen>:nth-child(n+10){animation-delay:.42s}

/* the art is alive: a slow push-in, a breath of light, bells that hang and lanterns that swing */
.plate{isolation:isolate}
.plate svg{transform-origin:50% 60%;animation:push 30s ease-in-out infinite alternate}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.055)}}
.plate::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(72% 62% at 50% 80%,rgba(255,190,100,.13),transparent 72%);mix-blend-mode:screen;animation:breathe 6s ease-in-out infinite}
.handoff.p0 .plate::after{background:radial-gradient(70% 62% at 50% 72%,rgba(242,166,60,.24),transparent 72%)}
.handoff.p1 .plate::after{background:radial-gradient(70% 62% at 50% 72%,rgba(69,212,191,.22),transparent 72%)}
@keyframes breathe{0%,100%{opacity:.2}50%{opacity:1}}
.swing{transform-box:fill-box;transform-origin:50% 0;animation:swing 9s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-1.1deg)}50%{transform:rotate(1.1deg)}}
.lsw{transform-box:fill-box;transform-origin:50% 0;animation:lsw 4.6s ease-in-out infinite}
@keyframes lsw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.brt{transform-box:fill-box;transform-origin:50% 100%;animation:brt 5.4s ease-in-out infinite}
@keyframes brt{0%,100%{transform:scale(1,1)}50%{transform:scale(1.006,1.02)}}
/* the Bell tolls once as the ending opens, then settles into its sway */
#app:not(.still) .ending .plate .swing{animation:toll 4.4s ease-out both,swing 9s ease-in-out 4.4s infinite}
@keyframes toll{0%{transform:rotate(0)}8%{transform:rotate(5deg)}22%{transform:rotate(-4.2deg)}38%{transform:rotate(3.2deg)}54%{transform:rotate(-2.2deg)}70%{transform:rotate(1.4deg)}85%{transform:rotate(-.8deg)}100%{transform:rotate(-1.1deg)}}
#app:not(.still) .ending .etitle{animation:titlein 1.5s cubic-bezier(.2,.7,.2,1) .35s both}
@keyframes titlein{from{opacity:0;transform:scale(1.1);filter:blur(8px)}to{opacity:1;transform:none;filter:none}}
#app:not(.still) .ending .eyebrow{animation:fadein 1s ease .15s both}

/* choosing: the pick rings once, the ready button breathes */
.opt.sel{animation:selring .55s ease-out}
@keyframes selring{from{box-shadow:0 0 0 1px var(--who),0 0 0 0 var(--who-a),0 14px 34px -18px var(--who)}to{box-shadow:0 0 0 1px var(--who),0 0 0 16px rgba(0,0,0,0),0 14px 34px -18px var(--who)}}
.bar .btn.primary:not([disabled]){animation:ready 3.2s ease-in-out infinite}
@keyframes ready{0%,100%{box-shadow:0 10px 32px -12px var(--who)}50%{box-shadow:0 10px 40px -4px var(--who)}}
@media (hover:hover){.opt:hover{transform:translateY(-1px)}.opt:hover:active{transform:scale(.995)}}
.pv svg{animation:pvin .4s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pvin{from{transform:scale(.86);opacity:.3}to{transform:none;opacity:1}}

/* the moves are turned face up, then the dice go in the air */
#app:not(.still) .reveal .pick{animation:flip .7s cubic-bezier(.2,.8,.2,1) both;transform-origin:50% 60%}
#app:not(.still) .reveal .pick.p1{animation-delay:.18s}
@keyframes flip{from{opacity:0;transform:perspective(700px) rotateY(-100deg)}to{opacity:1;transform:none}}
.reveal.rolling .lead.center{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

/* the result: dice land, the sum builds, the verdict is stamped, then the page and the banter arrive. Only on first sight (.enter), never on a reroll or a reload */
.enter{--t:0s}
.enter .res.p1{--t:.14s}
.enter>h2{animation:fadein .5s ease both}
.enter .res{animation:rise .55s cubic-bezier(.22,.7,.25,1) var(--t) both}
.enter .res .die{animation:land .7s cubic-bezier(.3,1.35,.5,1) calc(var(--t) + .1s) both}
@keyframes land{0%{transform:translateY(-22px) rotate(-70deg) scale(1.2);opacity:0}45%{opacity:1}60%{transform:translateY(0) rotate(7deg) scale(.92,1.06)}80%{transform:rotate(-3deg) scale(1.03)}100%{transform:none}}
.enter .res .eq>*{animation:rise .38s ease both}
.enter .res .eq>:nth-child(1){animation-delay:calc(var(--t) + 0.42s)}
.enter .res .eq>:nth-child(2){animation-delay:calc(var(--t) + 0.46s)}
.enter .res .eq>:nth-child(3){animation-delay:calc(var(--t) + 0.51s)}
.enter .res .eq>:nth-child(4){animation-delay:calc(var(--t) + 0.55s)}
.enter .res .eq>:nth-child(5){animation-delay:calc(var(--t) + 0.60s)}
.enter .res .eq>:nth-child(6){animation-delay:calc(var(--t) + 0.65s)}
.enter .res .eq>:nth-child(7){animation-delay:calc(var(--t) + 0.69s)}
.enter .res .eq>:nth-child(8){animation-delay:calc(var(--t) + 0.73s)}
.enter .res .eq>:nth-child(9){animation-delay:calc(var(--t) + 0.78s)}
.enter .res .eq>:nth-child(10){animation-delay:calc(var(--t) + 0.82s)}
.enter .res .eq>:nth-child(11){animation-delay:calc(var(--t) + 0.87s)}
.enter .res .eq>:nth-child(12){animation-delay:calc(var(--t) + 0.92s)}
.enter .res .eq>:nth-child(13){animation-delay:calc(var(--t) + 0.96s)}
.enter .res .eq>:nth-child(14){animation-delay:calc(var(--t) + 1.00s)}
.enter .res .eq .tot{display:inline-block;animation:totpop .55s cubic-bezier(.2,1.5,.4,1) calc(var(--t) + 1s) both}
@keyframes totpop{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.28);opacity:1}100%{transform:none}}
.enter .res .badge{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) calc(var(--t) + .6s) both}
@keyframes stamp{from{transform:scale(1.7) rotate(-9deg);opacity:0}to{transform:none;opacity:1}}
.enter .res .story{animation:fadein .6s ease calc(var(--t) + .8s) both}
.enter .res .chips .chip{animation:chipin .38s cubic-bezier(.2,1.4,.4,1) both}
@keyframes chipin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.enter .res .chips .chip:nth-child(1){animation-delay:calc(var(--t) + 1.20s)}
.enter .res .chips .chip:nth-child(2){animation-delay:calc(var(--t) + 1.29s)}
.enter .res .chips .chip:nth-child(3){animation-delay:calc(var(--t) + 1.38s)}
.enter .res .chips .chip:nth-child(4){animation-delay:calc(var(--t) + 1.47s)}
.enter .res .chips .chip:nth-child(5){animation-delay:calc(var(--t) + 1.56s)}
.enter .res .rr,.enter .res .fine{animation:fadein .5s ease calc(var(--t) + 1.3s) both}
/* Triumph shimmers, Success pings, Disaster shakes and flushes red */
.res .rplate::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:0}
.enter .res.t3 .rplate::after{opacity:1;mix-blend-mode:screen;background:linear-gradient(105deg,transparent 36%,rgba(255,224,138,.6) 50%,transparent 64%);transform:translateX(-120%);animation:shine 1.2s ease-out calc(var(--t) + .75s) both}
@keyframes shine{to{transform:translateX(120%)}}
.enter .res.t3 .badge{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) calc(var(--t) + .6s) both,glowp 1.9s ease-in-out calc(var(--t) + 1.2s) 2}
@keyframes glowp{0%,100%{box-shadow:0 0 22px -4px #ffd25a}50%{box-shadow:0 0 34px 2px #ffd25a}}
.enter .res.t3 .badge::after{content:"";position:absolute;inset:-12px;border-radius:999px;pointer-events:none;opacity:0;background:radial-gradient(circle at 12% 20%,#ffe08a 0 2px,transparent 3px),radial-gradient(circle at 88% 28%,#fff 0 1.6px,transparent 3px),radial-gradient(circle at 72% 92%,#ffd25a 0 2px,transparent 3px),radial-gradient(circle at 24% 96%,#fff 0 1.6px,transparent 3px),radial-gradient(circle at 50% 2%,#fff 0 1.6px,transparent 3px);animation:sparkle 1.4s ease-out calc(var(--t) + .85s) both}
@keyframes sparkle{0%{opacity:0;transform:scale(.55)}30%{opacity:1}100%{opacity:0;transform:scale(1.6)}}
.enter .res.t2 .badge{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) calc(var(--t) + .6s) both,ping 1s ease-out calc(var(--t) + .85s) both}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(147,221,159,.6)}100%{box-shadow:0 0 0 16px rgba(147,221,159,0)}}
.enter .res.t0{animation:rise .55s cubic-bezier(.22,.7,.25,1) var(--t) both,shake .55s cubic-bezier(.36,.07,.19,.97) calc(var(--t) + .55s) both}
@keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}100%{transform:none}}
.enter .res.t0 .rplate::after{background:radial-gradient(circle at 50% 50%,transparent 28%,rgba(239,116,104,.62));animation:hurt 1.2s ease-out calc(var(--t) + .55s) both}
@keyframes hurt{0%{opacity:0}16%{opacity:1}100%{opacity:0}}
/* below the cards: the day-book page unfurls, the two lanterns answer one another */
.pagecard{position:relative;overflow:hidden}
.enter .pagecard{transform-origin:50% 0;animation:unfurl .75s cubic-bezier(.2,.8,.25,1) 1.05s both}
@keyframes unfurl{from{opacity:0;transform:perspective(700px) rotateX(-55deg) scaleY(.6)}to{opacity:1;transform:none}}
.enter .pagecard::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(105deg,transparent 40%,rgba(233,196,106,.3) 50%,transparent 60%);transform:translateX(-120%);animation:shine 1.3s ease-out 1.85s both}
.enter .banter .bl{animation:say .55s ease both}
.enter .banter .bl.p0{--s:-14px;animation-delay:1.5s}
.enter .banter .bl.p1{--s:14px;animation-delay:2.15s}
.enter .pagecard~.banter .bl.p0{animation-delay:1.85s}
.enter .pagecard~.banter .bl.p1{animation-delay:2.5s}
@keyframes say{from{opacity:0;transform:translateX(var(--s,0))}to{opacity:1;transform:none}}
.enter .pairline{animation:fadein .7s ease 1.4s both}
.enter .chips.center{animation:fadein .6s ease 1.6s both}
.enter .minis.tight{animation:fadein .6s ease 1.1s both}
.enter>.bar{animation:fadein .5s ease .4s both}

/* what the descent says: the chalk settles like dust, the Sexton and the memory arrive slowly */
#app:not(.still) .chalk{animation:rise .6s ease .45s both,dust 1.3s ease .45s both}
@keyframes dust{from{filter:blur(4px)}to{filter:none}}
#app:not(.still) .behind,#app:not(.still) .sexton,#app:not(.still) .gossip{animation-duration:.9s}
.whisper>svg{animation:glimmer 3.4s ease-in-out infinite}
@keyframes glimmer{0%,100%{opacity:.7;transform:scale(1)}50%{opacity:1;transform:scale(1.14)}}
.pagepill.fresh{animation:pagepulse 1.3s ease .6s 2 both}
@keyframes pagepulse{0%,100%{box-shadow:0 0 0 0 rgba(233,196,106,0)}50%{box-shadow:0 0 18px 0 rgba(233,196,106,.65)}}
.said{animation:said .45s ease both}
@keyframes said{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ledger li:last-child{animation:rise .45s ease both}

/* health: the pips that were lost burn out, the pips that came back flare; the Undertoll's bell rings harder as it turns */
.pips i.drain{animation:drain 1.2s ease-out both}
@keyframes drain{0%{background:#ff9a8a;box-shadow:0 0 14px 2px rgba(255,120,100,.95);transform:scale(1.55)}35%{background:#e8695c;transform:scale(1.15)}100%{background:#2b2535;box-shadow:none;transform:none}}
.pips i.refill{animation:refill .95s ease-out both}
@keyframes refill{0%{background:#a6efb3;box-shadow:0 0 14px 2px rgba(147,221,159,.95);transform:scale(1.6)}100%{box-shadow:none;transform:none}}
#app:not(.still) .intro .danger .pips i.on:nth-child(1){animation-delay:0.50s}
#app:not(.still) .intro .danger .pips i.on:nth-child(2){animation-delay:0.59s}
#app:not(.still) .intro .danger .pips i.on:nth-child(3){animation-delay:0.68s}
#app:not(.still) .intro .danger .pips i.on:nth-child(4){animation-delay:0.77s}
#app:not(.still) .intro .danger .pips i.on:nth-child(5){animation-delay:0.86s}
#app:not(.still) .intro .danger .pips i.on{animation:pipon .4s cubic-bezier(.2,1.5,.4,1) both}
#app:not(.still) .meet .stats .pips i.on:nth-child(1){animation-delay:0.45s}
#app:not(.still) .meet .stats .pips i.on:nth-child(2){animation-delay:0.51s}
#app:not(.still) .meet .stats .pips i.on:nth-child(3){animation-delay:0.57s}
#app:not(.still) .meet .stats .pips i.on:nth-child(4){animation-delay:0.63s}
#app:not(.still) .meet .stats .pips i.on:nth-child(5){animation-delay:0.69s}
#app:not(.still) .meet .stats .pips i.on:nth-child(6){animation-delay:0.75s}
#app:not(.still) .meet .stats .pips i.on{animation:pipon .35s cubic-bezier(.2,1.5,.4,1) both}
#app:not(.still) .meet .char{animation:rise .6s cubic-bezier(.22,.7,.25,1) both}
#app:not(.still) .meet .char:nth-child(2){animation-delay:.2s}
.tollpill.w1 svg{transform-origin:50% 12%;animation:ringlo 4.4s ease-in-out infinite}
.tollpill.w2 svg{transform-origin:50% 12%;animation:ringhi 1.9s ease-in-out infinite}
.tollpill.w2{animation:tollglow 2.4s ease-in-out infinite}
@keyframes ringlo{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(8deg)}86%{transform:rotate(-6deg)}93%{transform:rotate(3deg)}}
@keyframes ringhi{0%,55%,100%{transform:rotate(0)}62%{transform:rotate(16deg)}72%{transform:rotate(-13deg)}82%{transform:rotate(9deg)}92%{transform:rotate(-5deg)}}
@keyframes tollglow{0%,100%{box-shadow:0 0 0 0 rgba(239,116,104,0)}50%{box-shadow:0 0 14px -2px rgba(239,116,104,.55)}}

/* the Book and the ending's long read: parts fade up as they scroll into view (where the browser can do it), the meters fill */
.bk-bar b{transform-origin:0 50%}
#app:not(.still) .book .bk-bar b{animation:grow 1.1s cubic-bezier(.2,.8,.2,1) .4s both}
@keyframes grow{from{transform:scaleX(0)}}
.bk-list li.new{animation:newrow 2.4s ease .8s 2}
@keyframes newrow{0%,100%{background:transparent}40%{background:rgba(233,196,106,.16)}}
.bk-note.new{animation:notepulse 2.6s ease 1s 2}
@keyframes notepulse{0%,100%{box-shadow:0 0 0 0 rgba(233,196,106,0)}50%{box-shadow:0 0 22px -4px rgba(233,196,106,.5)}}
@supports (animation-timeline:view()){
  #app:not(.still) .ending .chapter>:not(.fates),#app:not(.still) .ending .fate,#app:not(.still) .book .chapter>*{animation:vreveal linear both;animation-timeline:view();animation-range:entry 0% entry 45%}
  @keyframes vreveal{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
}

/* ---------- the sheet on a choice screen, and the first roll ---------- */
.csheet{margin:2px 0 12px;gap:10px}
.csheet .mini.flat{border:0;background:none;padding:0;border-radius:0}
.csheet .sstats{padding-top:10px;border-top:1px solid var(--line)}
.csheet .sb{padding:6px 5px 7px;border-radius:9px;transition:background-color .25s ease,box-shadow .25s ease}
.csheet .sb.use{background:var(--who-a);box-shadow:inset 0 0 0 1.5px var(--who)}
.csheet .sb.use dt{color:var(--fg)}
.csheet .sb.use .sv b{color:var(--who)}
.rb{display:inline-flex;align-items:center;gap:2px}.rb svg{width:11px;height:11px;color:var(--gold)}
.sread{margin:0;min-height:2.9em;font-size:.84rem;line-height:1.45;color:var(--mute)}
.sread b{color:var(--fg);font-weight:600}
.sread .n{font:700 .86rem/1 var(--disp);color:var(--fg)}
.csheet .svit{padding-top:8px}

.firstroll{margin-top:1.3rem}
.firstroll .aisle{margin:0}
.fduel{margin-top:.9rem;grid-template-columns:repeat(2,minmax(0,1fr))}
.fd .who,.fd small,.fresult,.sread,.csheet .mmain b,.opt .ot,.opt .od{overflow-wrap:anywhere}      /* a 14-letter name with nowhere to break wraps inside its card instead of pushing the screen wider */
.fd{padding:16px 10px 14px}
.fd .die{width:68px;height:68px}
.fd{position:relative;isolation:isolate}
.fd.win::before{content:"";position:absolute;inset:-1px;z-index:-1;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,var(--who-a),transparent 78%);box-shadow:0 0 0 1px var(--who),0 16px 36px -18px var(--who)}
.fd.win small{color:var(--gold)}
.fd.lose{opacity:.82}
.fresult{margin:.9rem 0 0;text-align:center;color:var(--mute);min-height:3.3em}
.fresult:focus{outline:none}
.firstroll.enter .fd .die{animation:land .7s cubic-bezier(.3,1.35,.5,1) both}
.firstroll.enter .fd.p1 .die{animation-delay:.12s}
.firstroll.enter .fd.win{animation:winin .7s cubic-bezier(.2,1.4,.4,1) .85s both}
@keyframes winin{0%{transform:scale(.96)}55%{transform:scale(1.045)}100%{transform:none}}
.firstroll.enter .fd.lose{animation:dimin .6s ease .85s both}
@keyframes dimin{from{opacity:1}}
.firstroll.enter .fd.win::before{animation:fadein .6s ease .85s both}
.firstroll.enter .fd small{animation:fadein .5s ease .9s both}
.firstroll.enter .fd.win small{animation:stamp .5s cubic-bezier(.2,1.6,.4,1) .95s both}
.firstroll.enter .fresult{animation:fadein .6s ease .9s both}
@media (max-width:420px){
  .csheet{padding:10px 12px 9px}
  .csheet .sb{padding:5px 4px 6px}
  .fd .die{width:60px;height:60px}
}

/* ---------- online: the lobby, the room code, what the other player is doing, the ready bar ---------- */
.lobby form{margin-top:1.2rem;display:grid;gap:14px;max-width:660px}
.lgrid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.lcard{display:grid;gap:10px;align-content:start;min-width:0;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--card)}
.lcard h3{font-size:1.02rem;letter-spacing:.06em}
.lcard p{color:var(--mute);font-size:.95rem}
.lcard .btn{justify-self:start}
.lcard .field input{min-width:0}
.codeinput{text-transform:uppercase;letter-spacing:.5em;text-indent:.5em;text-align:center;font-family:var(--disp)!important;font-size:1.45rem!important}
.lerr{color:var(--bad);font-size:.95rem}
.lfine{margin-top:1rem}
.roomcode{display:flex;justify-content:center;gap:10px;margin:1.1rem 0 .3rem}
.roomcode span{display:grid;place-items:center;width:clamp(50px,17vw,76px);aspect-ratio:3/4;border-radius:12px;border:1.5px solid var(--line2);background:linear-gradient(180deg,var(--card2),var(--card));font:700 clamp(1.8rem,8vw,2.8rem)/1 var(--disp);color:var(--gold);box-shadow:0 14px 34px -22px #000}
.roomcode span:nth-child(odd){border-color:rgba(242,166,60,.55)}
.roomcode span:nth-child(even){border-color:rgba(69,212,191,.55)}
.pstat{display:flex;align-items:center;gap:9px;margin-top:.85rem;font-size:.95rem;color:var(--mute)}
.pstat .dot,.presence .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--dim)}
.pstat.wait .dot{background:var(--amber);animation:dotpulse 1.6s ease-in-out infinite}
.pstat.go .dot{background:var(--good)}
.pstat.away .dot,.pstat.err .dot{background:var(--bad)}
.pstat.err{color:var(--bad)}
.lobby .pstat{justify-content:center;text-align:center}
.lobby.room .eyebrow,.lobby.room h2{text-align:center}
.presence{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;margin:2px 0 8px;padding:8px 12px;border:1px solid rgba(227,173,79,.38);border-radius:10px;background:rgba(227,173,79,.08);font-size:.9rem;color:var(--amber)}
.presence:empty{display:none}
.presence .dot{background:var(--bad);animation:dotpulse 1.4s ease-in-out infinite}
.presence .dot.note{background:var(--gold);animation:none}
.presence .linkbtn{color:var(--fg)}
@keyframes dotpulse{0%,100%{opacity:1}50%{opacity:.3}}
.bar.rdy{flex-direction:column;align-items:center;gap:6px}
.rdyline{min-height:1.3em;font-size:.9rem;color:var(--mute);text-align:center}
.rdyline.on{color:var(--gold)}
.ask{margin-top:1rem;padding:12px 14px;border:1px solid rgba(233,196,106,.45);border-radius:12px;background:rgba(233,196,106,.07)}
.ask.me{border-color:var(--who);background:var(--who-a)}
.askbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.opt.locked{cursor:default}
@media (hover:hover){.opt.locked:hover{transform:none}}
.waitroom .sheet{margin-top:1.1rem}
@media (min-width:700px){.lgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}

</style>

/* 11 */ { id: 'moths', title: 'The Moth Chapel', relic: 'mothcloak',

  intro: 'Every book here is chained to its shelf, and every chain is taut. The books are pulling, very gently, toward the spiral stair at the far end, as if they would like to leave. On a lectern sits an index in a hand so small it takes a minute to see that it is still writing.',

    { k: 'S', ic: 'book', a: 'team', t: 'Read to them', d: 'Chained things love being read to. Sit down, open the nearest one, and give {p} a quiet aisle.', fx: { win: { hp: 1 } },

/* ---------- the chandler's stall ----------

function normalize(s) {

  if (s.bn && !Array.isArray(s.bn)) s.bn = [];      /* the banter already heard in this descent */
  if (s.ek && !Array.isArray(s.ek)) s.ek = [];      /* and the kinds of echo */
  if (s.p && !s.order) s.order = D.legacyOrder.slice();      /* a descent saved before random rooms existed */
  if (!s.p || !Array.isArray(s.sets) || !s.order || s.sets.length !== s.order.length) s.sets = null;   /* saves from before the two hands of moves keep sharing one */
  if (!s.shop || !Array.isArray(s.shop.stock)) s.shop = null;      /* saves from before the chandler's stall pass her by */
  /* a descent saved at older prices sells what is left at today's, and nothing is ever free */
  if (s.shop) s.shop.stock.forEach((list, k) => (list || []).forEach(x => { if (x && x.left > 0) { const pr = x.kind === 'curio' ? E.CURIO_PRICE[k] : E.PRICE[x.kind]; if (pr >= 1) x.price = pr; else if (!(x.price >= 1)) x.price = 1; } }));

}

/* how the selected move adds up: the die, the stat it uses, and whatever edges this room gives that lantern */
function readout(w, r, i) {
  const op = E.optsFor(S, w, r)[i], parts = E.parts(S, w, r, i), stat = parts[0], mod = E.mod(parts);

  const rel = c.relics.length ? `<p class="svit">${c.relics.map(id => { const x = D.relics[id]; return x ? `<span class="st">${ico('gem')}${esc(x.name)} · +${x.amt} ${D.stats[x.k]}</span>` : ''; }).join('')}</p>` : '';

/* the lock-in button: what it says, and whether it can be pressed yet. Online, the lantern that chooses second locks in after the first. */
function lockState(w, mine) {
  const sel = S.sel >= 0 ? mine[S.sel] : null, lead = E.first(S);
  if (!sel) return { dis: true, t: 'Pick a move' };
  if (on() && w !== lead && !O.lockedAt(S, lead)) return { dis: true, t: 'Waiting for ' + S.p[lead].name + ' to lock in' };

}
function choose() {

  const attLab = { team: `Helps ${esc(S.p[o].name)}`, self: 'For yourself', solo: 'Your own way' };
  const cards = rows.filter(x => !locked || x.i === S.pick[w]).map(({ op, i, parts, mod, p }) => {
    const extra = parts.filter(x => x.kind === 'motive' || (x.kind === 'perk' && r.finale)).map(x => `<span class="why"><span class="plus">+${x.v}</span>${esc(x.l)}</span>`).join('');
    const inner = `<span class="oic">${ico(op.ic)}</span>
      <span class="obody"><span class="ot">${esc(op.t)}</span><span class="od">${F(op.d, w)}</span>
      <span class="om"><span class="chip stat">${D.stats[op.k]} ${sgn(mod)}</span>${r.finale ? `<span class="chip note">${esc(op.chip)}</span>` : `<span class="chip att a-${op.a}">${attLab[op.a]}</span>`}<span class="chip odds">${oddsWord(p)}</span></span>${extra}</span>

const SCREENS = { title, names, lobby, create, handoff, meet, intro, stall, choose, roll, ending };

}

  const fk = at && at.dataset && at.dataset.act ? { a: at.dataset.act, i: at.dataset.i, w: at.dataset.w, id: at.dataset.id } : null;

/* ---------- online: moving the room along ---------- */
/* what a change needs to know about the room as it was just before it, so the change can be shown (dice in the air, health bars sliding) */
function probe() {

}

  if (p.screen === 'roll' && p.rl && S.screen !== 'roll') { if (p.hp) ui.hpFrom = p.hp; if (p.page) ui.pageFresh = true; }

  if (S.screen === 'stall' && N.ask && N.ask.n !== ui.askSeen) { ui.askSeen = N.ask.n; ui.showAsk = true; }      /* a new question about coin: whoever it concerns is shown it, even if it landed off the screen */

  if (roll) ui.rolling = true;

  render(moved, !moved);

/* the host tells the guest what the guest may see */

function act(m, quiet) {

    const p = probe(); let ok = false;
    try { ok = O.apply(S, 0, msg); } catch (e) { ok = false; }
    if (ok) { push(); if (quiet) save(); else after(p); }

}

/* ---------- actions ---------- */
const ACT = {

  resume() { S = ui.saved; ui.saved = null; render(true); },
  names(form) {
    let a = (form.n0.value || '').trim().slice(0, 14) || 'Ember', b = (form.n1.value || '').trim().slice(0, 14) || 'Verdigris';
    if (a.toLowerCase() === b.toLowerCase()) b += ' II';
    S.picks = [{}, {}]; S.names = [a, b]; S.offer = [null, null]; S.rid = [null, null]; go({ screen: 'create', cp: 0, cq: -1, sel: -1 });
  },
  sel(t) {
    const i = +t.dataset.i; S.sel = i;
    app.querySelectorAll('.opt').forEach((b, j) => { b.classList.toggle('sel', j === i); b.setAttribute('aria-pressed', j === i); });

  buy(t) {
    const k = E.stopDue(S); if (k < 0) return;
    if (on()) { act({ a: 'buy', k, w: t.dataset.w }); return; }
    const wid = t.dataset.w, who = S.shop.who === 1 ? 1 : 0, w = (S.shop.stock[k] || []).find(x => x.id === wid);
    ui.hpFrom = S.p.map(c => c.hp);
    const q = E.buy(S, k, wid, who);
    if (!q.ok || !w) { render(false); return; }
    const rl = w.relic && D.relics[w.relic];
    const PW = D.stall.wares[w.kind], tpl = w.kind === 'gamble' ? (PW.slips[q.slip] || PW.slips.dust).said : PW.said;
    let said = F(tpl.replace(/\{item\}/g, q.relic ? esc(D.relics[q.relic].name) : rl ? esc(rl.name) : ''), who);
    if (q.payer !== who) said += ' ' + F(D.stall.covered, q.payer);
    ui.said = said; save(); render(false);
    const sd = app.querySelector('.said'); if (sd) { try { sd.focus({ preventScroll: true }); } catch (e) { /* ignore */ } }
  },
  leave() { E.leave(S); ui.said = ''; go({ screen: 'intro', sel: -1 }); },
  again() {
    const n = S.names.slice(); clearSaved(); S = E.fresh(); S.names = n; go({ screen: 'create', cp: 0, cq: -1, sel: -1 });
  },
  newnames() { clearSaved(); S = E.fresh(); go({ screen: 'names' }); },
  copy() {
    const e = S.end, body = [e.title + ' — ' + e.subtitle + ' (Ending № ' + (e.index + 1).toLocaleString('en-US') + ')'].concat(E.plain(S, e).slice(1)).join('\n\n') + '\n\nTwo Lanterns';
    const ok = () => { ui.copied = 'Copied'; ui.fallback = ''; render(false); setTimeout(() => { ui.copied = ''; if (S.screen === 'ending') render(false); }, 1800); };
    const bad = () => { ui.fallback = body; render(false); const b = app.querySelector('.copybox'); if (b) { try { b.focus(); b.select(); } catch (x) { /* ignore */ } } };
    try { navigator.clipboard.writeText(body).then(ok, bad); } catch (x) { bad(); }
  },
  book() { ui.bookFrom = S.screen === 'ending' ? 'ending' : 'title'; ui.bookY = window.scrollY || 0; ui.book = true; ui.erase = false; render(true); },
  closebook() { ui.book = false; ui.erase = false; render(false); try { window.scrollTo(0, ui.bookY || 0); } catch (e) { /* ignore */ } },
  erase() { ui.erase = true; render(false); },
  'erase-no'() { ui.erase = false; render(false); },
  'erase-yes'() { BK.clear(); ui.erase = false; render(false); },
  reset() { ui.confirm = true; render(false); },
  'reset-no'() { ui.confirm = false; render(false); },
  'reset-yes'() { if (on()) { leaveRoom(false); return; } clearSaved(); ui.confirm = false; ui.rolling = false; S = E.fresh(); render(true); },

  /* ----- online ----- */
  online() { ui.lob = { name: lastName(), code: '', err: '' }; S = E.fresh(); S.screen = 'lobby'; ui.seen = -1; render(true); },
  host() {
    if (!NT.available()) return;
    const f = app.querySelector('[data-form="lobby"]'), name = O.cleanName(f ? f.n.value : ui.lob.name);
    ui.lob.name = name; rememberName(name);
    const code = NT.host({});
    S = O.room(code, name); ui.seen = -1; ui.token = null; ui.gtok = null; ui.lcopied = ''; ui.lfallback = '';
    save(); render(true);
  },
  join(form) {
    if (!NT.available()) return;
    const name = O.cleanName(form.n.value), code = NT.cleanCode(form.code.value);
    ui.lob.name = name; ui.lob.code = code; rememberName(name);
    if (!NT.validCode(code)) { ui.lob.err = code.length < 4 ? 'A room code is four letters. Ask your partner to read it out again.' : 'That does not look like a room code from this game.'; render(false); return; }
    ui.lob.err = ''; ui.token = NT.makeToken(); ui.gtok = null; ui.seen = -1;
    S = E.fresh(); S.screen = 'lobby'; S.net = O.fresh(code, 1, 1); S.names = ['', name || 'Verdigris']; S.cp = 1;
    NT.join(code, { name: S.names[1], token: ui.token });
    save(); render(true);
  },
  rejoin() {
    const d = ui.online; if (!d) return;
    ui.online = null; ui.seen = -1; ui.token = d.token || null; ui.gtok = d.guestToken || null;
    S = d.S;
    if (d.role === 'host') NT.host({ code: d.code, guestToken: d.guestToken || undefined });
    else NT.join(d.code, { name: d.name, token: d.token || undefined });
    render(true);
  },
  forget() { clearOnline(); render(false); },
  ready() { if (on()) act({ a: 'ready', on: !S.net.ready[S.net.me] }); },
  ans(t) { act({ a: 'ans', n: +t.dataset.n, yes: t.dataset.yes === '1' }); },
  cancel() { act({ a: 'cancel' }); },
  freeseat() { if (NT.freeSeat()) { ui.gtok = null; save(); render(false, true); } },
  copycode() { copyOut(S.net.code, 'code'); },
  copylink() { copyOut(roomLink(S.net.code), 'link'); },
  lobbyback() { if (on()) leaveRoom(true); else { S = E.fresh(); render(true); } },
  retry() {
    const me = S.net.me;
    if (me === 0) { if (S.screen === 'lobby') S.net.code = NT.host({}); else NT.host({ code: S.net.code, guestToken: ui.gtok || undefined }); }
    else NT.join(S.net.code, { name: S.names[1], token: ui.token || undefined });
    save(); render(false);
  },
  leaveroom() { leaveRoom(false); }
};

app.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
  const f = ACT[t.dataset.act]; if (f) f(t, e);
});
app.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.closest('[data-form="names"]'); if (f) { ACT.names(f); return; }
  const l = e.target.closest('[data-form="lobby"]'); if (l) ACT.join(l);
});
app.addEventListener('input', e => {
  const t = e.target; if (!t || !t.form || t.form.dataset.form !== 'lobby') return;
  if (t.name === 'n') ui.lob.name = t.value;
  else if (t.name === 'code') { const v = NT.cleanCode(t.value); if (v !== t.value) t.value = v; ui.lob.code = v; }
});

function boot(data) {
  data = data || {};
  R.init(); BK.init();
  if (data.S) { S = normalize(data.S); ui.saved = null; } else { S = E.fresh(); ui.saved = loadSaved(); }
  ui.online = NT.available() ? loadOnline() : null;
  ui.lob.name = lastName();
  let room = ''; try { room = NT.cleanCode(new URLSearchParams(window.location.search).get('room') || ''); } catch (e) { /* no address bar */ }
  if (room && NT.available() && !data.S) {      /* opened from a room link: straight to the join screen, or back into the room if this browser was already in it */
    if (ui.online && ui.online.role === 'guest' && ui.online.code === room) { ACT.rejoin(); return; }
    ui.lob.code = room; S = E.fresh(); S.screen = 'lobby';
  }
  render(false);
}
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(() => ({ S })); } catch (e) { /* ignore */ }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
window.__tl = { get S() { return S; }, ACT, E, D, R, B: BK, ST, ui, O, NT, act, probe };
})();

</script>
